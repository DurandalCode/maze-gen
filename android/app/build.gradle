plugins { id 'com.android.application' }

android {
    namespace 'lab.maze.android'
    compileSdk 35
    defaultConfig {
        applicationId 'lab.maze.android'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.1.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        development {
            storeFile file(System.getenv('MAZE_ANDROID_KEYSTORE') ?: '../.local/maze-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.development }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
