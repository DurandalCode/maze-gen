[package]
name = "maze-lab"
version = "0.1.0"
description = "Лаборатория физических лабиринтов"
authors = ["Maze Lab"]
edition = "2021"

[lib]
name = "maze_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
